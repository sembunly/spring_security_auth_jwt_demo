
  server:
    port: 8080

  app:
    jwt:
      secret: ${JWT_SECRET:local-dev-only-secret-key-replace-before-deploying-1234567890}
      expiration-seconds: 3600
    admin:
      username: ${APP_ADMIN_USERNAME:}
      email: ${APP_ADMIN_EMAIL:}
      password: ${APP_ADMIN_PASSWORD:}

  spring:
    datasource:
      url: jdbc:postgresql://localhost:5432/spring_security_auth_jwt_db
      username: spring_security_user
      password: "0000"
      driver-class-name: org.postgresql.Driver

      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      open-in-view: false
      properties:
        hibernate:
          format_sql: true
          jdbc:
            time_zone: UTC

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.orm.jdbc.bind: TRACE
